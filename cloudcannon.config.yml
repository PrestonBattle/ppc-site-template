source: ""
paths:
  static: ""
  uploads: assets/uploads
  dam_static: ""
  dam_uploads: assets/uploads

collection_groups:
  - heading: Pages
    collections:
      - pages
  - heading: Data
    collections:
      - client
      - data

collections_config:
  pages:
    path: src/content/pages
    glob:
      - "**/*.md"
    url: /[full_slug]/
    icon: laptop_mac
    _enabled_editors:
      - visual
    add_options:
      - name: Add New Page
        schema: default
        icon: pages
    schemas:
      default:
        name: New Page
        path: .cloudcannon/schemas/page.md
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    new_preview_url: /
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.
  client:
    path: src/content/client
    glob:
      - "**/*.yml"
    icon: badge
    _enabled_editors:
      - data
    disable_add: true
    disable_add_folder: true
    _inputs:
      practiceName:
        type: text
        comment: The practice name shown in the header and footer.
      phone:
        type: text
        comment: Display phone number, e.g. (555) 555-5555.
      bookingLink:
        type: url
        comment: Online scheduling link, or '#contact' to scroll to the form.

      theme.preset:
        type: select
        comment: Pick a preset for a curated look, or "custom" to define your own colors.
        options:
          values:
            - id: dental-blue
              name: Dental Blue — classic navy with green CTAs
            - id: dental-teal
              name: Dental Teal — modern teal with navy
            - id: warm-earthy
              name: Warm Earthy — terracotta with sage
            - id: bold-red
              name: Bold Red — high-urgency red
            - id: classic-navy
              name: Classic Navy — traditional navy with gold
            - id: custom
              name: Custom — I'll define colors manually

      theme.brand:
        type: color
        comment: (override) Primary brand color — leave blank to use preset value
      theme.brandText:
        type: color
        comment: (override) Text color on brand-colored backgrounds
      theme.accent:
        type: color
        comment: (override) CTA and button color
      theme.accentText:
        type: color
        comment: (override) Text on accent-colored backgrounds

      theme.announcementBg:
        type: color
        comment: (override) Announcement bar background — defaults to preset or brand
      theme.announcementText:
        type: color
        comment: (override) Announcement bar text — defaults to preset or brandText
      theme.heroBg:
        type: color
        comment: (override) Hero section background — defaults to page background
      theme.heroText:
        type: color
        comment: (override) Hero section text color — defaults to page text

      theme.brandMuted:
        type: color
        comment: (advanced) Lighter companion to brand
      theme.brandSubtle:
        type: color
        comment: (advanced) Even lighter brand variant
      theme.link:
        type: color
        comment: (advanced) Link color — defaults to accent
      theme.linkHover:
        type: color
        comment: (advanced) Link hover color
      theme.bg:
        type: color
        comment: (advanced) Page background — default white
      theme.bgSurface:
        type: color
        comment: (advanced) Alternating section background
      theme.bgMuted:
        type: color
        comment: (advanced) Muted section background
      theme.text:
        type: color
        comment: (advanced) Body text color
      theme.textStrong:
        type: color
        comment: (advanced) Heading text color
      theme.textMuted:
        type: color
        comment: (advanced) Secondary/muted text color
      theme.border:
        type: color
        comment: (advanced) Default border color

      tracking.ga4MeasurementId:
        type: text
        comment: "GA4 Measurement ID (starts with G-). Leave blank to skip Google Analytics."
      tracking.simplifiId:
        type: text
        comment: "Simplifi advertiser GUID from the sifitag URL. Leave blank if unused."
      tracking.ctmAccountId:
        type: text
        comment: "CallTrackingMetrics account ID (number in the tctm.co URL). Leave blank if unused."
      tracking.trackConversions:
        type: switch
        comment: "Fire GA4 events on phone clicks and booking button clicks. Needs GA4 above."

    _group:
      - heading: Practice Information
        inputs:
          - practiceName
          - phone
          - bookingLink

      - heading: Theme Preset
        inputs:
          - theme.preset

      - heading: Brand Color Overrides
        collapsed: true
        inputs:
          - theme.brand
          - theme.brandText
          - theme.accent
          - theme.accentText

      - heading: Section Color Overrides
        collapsed: true
        inputs:
          - theme.announcementBg
          - theme.announcementText
          - theme.heroBg
          - theme.heroText

      - heading: Advanced Overrides
        collapsed: true
        inputs:
          - theme.brandMuted
          - theme.brandSubtle
          - theme.link
          - theme.linkHover
          - theme.bg
          - theme.bgSurface
          - theme.bgMuted
          - theme.text
          - theme.textStrong
          - theme.textMuted
          - theme.border

      - heading: Tracking
        collapsed: true
        inputs:
          - tracking.ga4MeasurementId
          - tracking.simplifiId
          - tracking.ctmAccountId
          - tracking.trackConversions

  data:
    path: src/data
    glob:
      - "**/*.json"
      - "**/*.yml"
    icon: database
    _enabled_editors:
      - data
    _inputs:
      social_platform:
        type: select
        options:
          values:
            - id: facebook
              name: Facebook
            - id: instagram
              name: Instagram
            - id: twitter
              name: Twitter
            - id: linkedin
              name: LinkedIn
            - id: pinterest
              name: Pinterest
            - id: tiktok
              name: TikTok
            - id: youtube
              name: YouTube
data_config:
  seo:
    path: src/data/seo.json
_snippets_imports:
  hugo: false
  jekyll: false
  eleventy: false
  processwire: false
_editor:
  default_path: /