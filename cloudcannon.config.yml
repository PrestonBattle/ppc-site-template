source: ""
paths:
  static: ""
  uploads: assets/uploads
  dam_static: ""
  dam_uploads: assets/uploads

collection_groups:
  - heading: Pages
    collections:
      - pages
  - heading: Data
    collections:
      - client
      - data

collections_config:
  pages:
    path: src/content/pages
    glob:
      - "**/*.md"
    url: /[full_slug]/
    icon: laptop_mac
    _enabled_editors:
      - visual
    add_options:
      - name: Add New Page
        schema: default
        icon: pages
    schemas:
      default:
        name: New Page
        path: .cloudcannon/schemas/page.md
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    new_preview_url: /
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.

  client:
    path: src/content/client
    glob:
      - "**/*.yml"
    icon: badge
    _enabled_editors:
      - data
    disable_add: true
    disable_add_folder: true
    _inputs:
      practiceName:
        type: text
        comment: The practice name shown in the header and footer.
      phone:
        type: text
        comment: Display phone number, e.g. (555) 555-5555.
      bookingLink:
        type: url
        comment: Online scheduling link, or '#contact' to scroll to the form.

      theme:
        type: object
        comment: Pick a preset from the picker below, or edit individual colors.
        options:
          structures: _structures.theme_presets

      theme.brand:
        type: color
        comment: Primary brand color
      theme.brandText:
        type: color
        comment: Text on brand-colored backgrounds
      theme.accent:
        type: color
        comment: CTA and button color
      theme.accentText:
        type: color
        comment: Text on accent-colored backgrounds
      theme.announcementBg:
        type: color
        comment: Announcement bar background
      theme.announcementText:
        type: color
        comment: Announcement bar text

      tracking:
        type: object
        options:
          subtype: object
          groups:
            - heading: Analytics IDs
              inputs:
                - ga4MeasurementId
                - simplifiId
                - ctmAccountId
            - heading: Options
              inputs:
                - trackConversions

      tracking.ga4MeasurementId:
        type: text
        comment: "GA4 Measurement ID (starts with G-). Leave blank to skip Google Analytics."
      tracking.simplifiId:
        type: text
        comment: "Simplifi advertiser GUID from the sifitag URL. Leave blank if unused."
      tracking.ctmAccountId:
        type: text
        comment: "CallTrackingMetrics account ID (number in the tctm.co URL). Leave blank if unused."
      tracking.trackConversions:
        type: switch
        comment: "Fire GA4 events on phone clicks and booking button clicks. Needs GA4 above."

  data:
    path: src/data
    glob:
      - "**/*.json"
      - "**/*.yml"
    icon: database
    _enabled_editors:
      - data
    _inputs:
      social_platform:
        type: select
        options:
          values:
            - id: facebook
              name: Facebook
            - id: instagram
              name: Instagram
            - id: twitter
              name: Twitter
            - id: linkedin
              name: LinkedIn
            - id: pinterest
              name: Pinterest
            - id: tiktok
              name: TikTok
            - id: youtube
              name: YouTube

data_config:
  seo:
    path: src/data/seo.json

_snippets_imports:
  hugo: false
  jekyll: false

_structures:
  theme_presets:
    style: modal
    values:
      - label: Dental Blue
        icon: palette
        value:
          brand: "#132a3e"
          brandText: "#ffffff"
          accent: "#78b843"
          accentText: "#ffffff"
          announcementBg: "#132a3e"
          announcementText: "#ffffff"
      - label: Dental Teal
        icon: palette
        value:
          brand: "#132a3e"
          brandText: "#ffffff"
          accent: "#43BBBF"
          accentText: "#ffffff"
          announcementBg: "#43BBBF"
          announcementText: "#ffffff"
      - label: Warm Earthy
        icon: palette
        value:
          brand: "#a0522d"
          brandText: "#ffffff"
          accent: "#7a9968"
          accentText: "#ffffff"
          announcementBg: "#a0522d"
          announcementText: "#ffffff"
      - label: Bold Red
        icon: palette
        value:
          brand: "#c8102e"
          brandText: "#ffffff"
          accent: "#132a3e"
          accentText: "#ffffff"
          announcementBg: "#c8102e"
          announcementText: "#ffffff"
      - label: Classic Navy
        icon: palette
        value:
          brand: "#0e2a47"
          brandText: "#ffffff"
          accent: "#c8a24b"
          accentText: "#0e2a47"
          announcementBg: "#0e2a47"
          announcementText: "#c8a24b"