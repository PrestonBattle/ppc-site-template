source: ""
paths:
  static: ""
  uploads: assets/uploads
  dam_static: ""
  dam_uploads: assets/uploads

collection_groups:
  - heading: Pages
    collections:
      - pages
  - heading: Data
    collections:
      - client
      - data

collections_config:
  pages:
    path: src/content/pages
    glob:
      - "**/*.md"
    url: /[full_slug]/
    icon: laptop_mac
    _enabled_editors:
      - visual
    add_options:
      - name: Add New Page
        schema: default
        icon: pages
    schemas:
      default:
        name: New Page
        path: .cloudcannon/schemas/page.md
        remove_extra_inputs: false
    create:
      path: "[relative_base_path]/{filename|slugify|lowercase}.md"
    new_preview_url: /
    _inputs:
      title:
        type: text
        comment: Controls the metadata title for the page.

  client:
    path: src/content/client
    glob:
      - "**/*.yml"
    icon: badge
    _enabled_editors:
      - data
    disable_add: true
    disable_add_folder: true
    _inputs:
      practiceName:
        type: text
        comment: The practice name shown in the header and footer.
      phone:
        type: text
        comment: Display phone number, e.g. (555) 555-5555.
      bookingLink:
        type: url
        comment: Online scheduling link, or '#contact' to scroll to the form.

      theme:
        type: object
        comment: Pick a preset from the picker below, or edit individual colors.
        options:
          structures: _structures.theme_presets

      theme.brand:
        type: color
        comment: Primary brand color
      theme.brandText:
        type: color
        comment: Text on brand-colored backgrounds
      theme.accent:
        type: color
        comment: CTA and button color
      theme.accentText:
        type: color
        comment: Text on accent-colored backgrounds
      theme.announcementBg:
        type: color
        comment: Announcement bar background
      theme.announcementText:
        type: color
        comment: Announcement bar text
      typography:
        type: object
        comment: Pick a preset, or set individual fonts and sizes.
        options:
          structures: _structures.typography_presets

      typography.headingsFont:
        type: select
        options:
          values:
            - Poppins
            - Inter
            - Montserrat
            - Nunito
            - Lato
            - Merriweather
            - Playfair Display
            - Open Sans
            - Roboto
            - Source Sans Pro
            - Custom
            
      typography.headingsFontCustom:
        type: text
        comment: (only used if Custom above) Exact Google Fonts name — check fonts.google.com to verify spelling.

      typography.bodyFont:
        type: select
        comment: Font family for body text and inputs.
        options:
          values:
            - id: Poppins
              name: Poppins — modern, rounded
            - id: Inter
              name: Inter — modern, tech-forward
            - id: Montserrat
              name: Montserrat — clean, versatile
            - id: Nunito
              name: Nunito — friendly, rounded
            - id: Lato
              name: Lato — professional, warm
            - id: Merriweather
              name: Merriweather — serif, traditional
            - id: Playfair Display
              name: Playfair Display — elegant serif, luxury
            - id: Open Sans
              name: Open Sans — safe workhorse
            - id: Roboto
              name: Roboto — clinical, neutral
            - id: Source Sans Pro
              name: Source Sans Pro — balanced sans
            - id: Custom
              name: Custom — enter font name manually

      typography.bodyFontCustom:
        type: text
        comment: (only used if Custom above) Exact Google Fonts name.

      typography.baseSize:
        type: select
        comment: Overall text size baseline.
        options:
          values:
            - id: sm
              name: Small
            - id: md
              name: Medium (default)
            - id: lg
              name: Large

      typography.headingScale:
        type: select
        comment: Ratio between heading sizes.
        options:
          values:
            - id: compact
              name: Compact — subtle hierarchy
            - id: balanced
              name: Balanced — typical PPC feel
            - id: dramatic
              name: Dramatic — big statement heros
      tracking:
        type: object
        options:
          subtype: object
          groups:
            - heading: Analytics IDs
              inputs:
                - ga4MeasurementId
                - simplifiId
                - ctmAccountId
            - heading: Options
              inputs:
                - trackConversions

      tracking.ga4MeasurementId:
        type: text
        comment: "GA4 Measurement ID (starts with G-). Leave blank to skip Google Analytics."
      tracking.simplifiId:
        type: text
        comment: "Simplifi advertiser GUID from the sifitag URL. Leave blank if unused."
      tracking.ctmAccountId:
        type: text
        comment: "CallTrackingMetrics account ID (number in the tctm.co URL). Leave blank if unused."
      tracking.trackConversions:
        type: switch
        comment: "Fire GA4 events on phone clicks and booking button clicks. Needs GA4 above."

  data:
    path: src/data
    glob:
      - "**/*.json"
      - "**/*.yml"
    icon: database
    _enabled_editors:
      - data
    _inputs:
      social_platform:
        type: select
        options:
          values:
            - id: facebook
              name: Facebook
            - id: instagram
              name: Instagram
            - id: twitter
              name: Twitter
            - id: linkedin
              name: LinkedIn
            - id: pinterest
              name: Pinterest
            - id: tiktok
              name: TikTok
            - id: youtube
              name: YouTube

data_config:
  seo:
    path: src/data/seo.json

_snippets_imports:
  hugo: false
  jekyll: false

