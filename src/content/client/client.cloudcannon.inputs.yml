_inputs:
  theme.preset:
    type: select
    comment: Pick a preset for a curated look, or "custom" to define your own colors
    options:
      values:
        - value: dental-blue
          label: Dental Blue — classic navy with green CTAs
        - value: dental-teal
          label: Dental Teal — modern teal with navy
        - value: warm-earthy
          label: Warm Earthy — terracotta with sage
        - value: bold-red
          label: Bold Red — high-urgency red
        - value: classic-navy
          label: Classic Navy — traditional navy with gold
        - value: custom
          label: Custom — I'll define colors manually

  theme.brand:
    type: color
    comment: (override) Primary brand color — leave blank to use preset value
  theme.brandText:
    type: color
    comment: (override) Text color on brand-colored backgrounds
  theme.accent:
    type: color
    comment: (override) CTA and button color
  theme.accentText:
    type: color
    comment: (override) Text on accent-colored backgrounds

  theme.announcementBg:
    type: color
    comment: (override) Announcement bar background — defaults to preset or brand
  theme.announcementText:
    type: color
    comment: (override) Announcement bar text — defaults to preset or brandText
  theme.heroBg:
    type: color
    comment: (override) Hero section background — defaults to page background
  theme.heroText:
    type: color
    comment: (override) Hero section text color — defaults to page text

  theme.brandMuted:
    type: color
    comment: (advanced) Lighter companion to brand
  theme.brandSubtle:
    type: color
    comment: (advanced) Even lighter brand variant
  theme.link:
    type: color
    comment: (advanced) Link color — defaults to accent
  theme.linkHover:
    type: color
    comment: (advanced) Link hover color
  theme.bg:
    type: color
    comment: (advanced) Page background — default white
  theme.bgSurface:
    type: color
    comment: (advanced) Alternating section background
  theme.bgMuted:
    type: color
    comment: (advanced) Muted section background
  theme.text:
    type: color
    comment: (advanced) Body text color
  theme.textStrong:
    type: color
    comment: (advanced) Heading text color
  theme.textMuted:
    type: color
    comment: (advanced) Secondary/muted text color
  theme.border:
    type: color
    comment: (advanced) Default border color

_groups:
  - heading: Theme Preset
    inputs:
      - theme.preset
  - heading: Brand Color Overrides
    collapsed: true
    inputs:
      - theme.brand
      - theme.brandText
      - theme.accent
      - theme.accentText
  - heading: Section Color Overrides
    collapsed: true
    inputs:
      - theme.announcementBg
      - theme.announcementText
      - theme.heroBg
      - theme.heroText
  - heading: Advanced Overrides
    collapsed: true
    inputs:
      - theme.brandMuted
      - theme.brandSubtle
      - theme.link
      - theme.linkHover
      - theme.bg
      - theme.bgSurface
      - theme.bgMuted
      - theme.text
      - theme.textStrong
      - theme.textMuted
      - theme.border